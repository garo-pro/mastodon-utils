[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mastodon-utils"
version = "0.1.0"
description = "Mastodon account and server statistics, engagement analytics and scraping from the command line"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.25",
    # Windows ships no IANA time zone database, so zoneinfo (--tz) needs this package there.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mastodon-utils = "mastodon_utils.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
